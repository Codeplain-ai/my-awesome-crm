[pytest]
# The host suite lives in tests/; plain_modules/ holds generated copies of the
# same unit tests (staged into tests/ by the unit-test runner), as do plain/dist/
# and any other render output — collecting those collides on module names.
testpaths = tests
norecursedirs = plain .venv
# Put the repo root on sys.path so `from src...` resolves under the `pytest`
# console script, which — unlike `python -m pytest` — does not add the cwd.
pythonpath = .
